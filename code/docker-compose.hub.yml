# Run the published images from Docker Hub (no source checkout needed):
#   docker compose -f docker-compose.hub.yml up
#
# NOTE: the app now runs on PostgreSQL (not SQLite). The api-2.0 / frontend-2.0 images
# must be built from this repo and pushed before this file will work:
#   docker compose -f docker-compose.yml build
#   docker tag <built-api> tuadocker/namesync:api-2.0 && docker push tuadocker/namesync:api-2.0
#   docker tag <built-frontend> tuadocker/namesync:frontend-2.0 && docker push ...
# The repo tuadocker/namesync is PRIVATE, so first run: docker login
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: namesync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-namesync}
      POSTGRES_DB: namesync
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namesync -d namesync"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: tuadocker/namesync:api-2.0
    environment:
      NODE_ENV: production
      DB_ENGINE: postgres
      DATABASE_URL: postgres://namesync:${POSTGRES_PASSWORD:-namesync}@postgres:5432/namesync
      UPLOAD_DIR: /data/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Hand the matching to the external workflow (docs/EXTERNAL-MATCHER.md). Needs
      # docs/migrations/2026-07-14-row-status.sql applied to the database first.
      EXTERNAL_MATCHER: ${EXTERNAL_MATCHER:-}
      COMPANY_WEBHOOK_URL: ${COMPANY_WEBHOOK_URL:-}
      FACEBOOK_WEBHOOK_URL: ${FACEBOOK_WEBHOOK_URL:-}
      WEBHOOK_CALLBACK_URL_BASE: ${WEBHOOK_CALLBACK_URL_BASE:-}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN:-}
    ports:
      - "4000:4000"
    volumes:
      - api-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: tuadocker/namesync:frontend-2.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
  pgdata:
