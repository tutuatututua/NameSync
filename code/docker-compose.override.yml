# LAN access for the compose stack. Added 2026-07-20; auth restored and this file rewritten
# 2026-08-04.
#
# Docker Compose picks this up automatically alongside docker-compose.yml.
#
# History worth keeping, because both were ways into the live database with no Center check:
#   - This file used to set AUTH_DISABLED="1", so every request resolved to a hardcoded local
#     admin. Anyone who could reach http://<this-host>:3000 on the LAN was that admin.
#   - Even after that went, the API still exposed /api/auth/login and /api/auth/otp/login,
#     which minted a session from a password stored in app_user. Those routes are now deleted;
#     Center is the only way in.
#
# WHY NODE_ENV IS STILL `development` — do NOT delete this file to "finish the job".
# AUTH_COOKIE_SECURE defaults to true in production, so the session cookie would be dropped
# over plain http:// — login would appear to succeed and sign nobody in. Setting
# AUTH_COOKIE_SECURE=false is refused in production by design. Until this is served over TLS
# with a real hostname, development is the honest setting.
#
# (The other old reason is gone: production used to exit at boot for want of a sign-in path,
# and docker-compose.yml now passes CENTER_PLAYME_URL.)
#
# So this is the LAN/plain-http profile, not an auth bypass. Moving to production is a
# deployment task — TLS, a real hostname — not a line to delete here.
#
# DB_SKIP_MIGRATE="1" is deliberately NOT overridden here — it stays inherited from
# docker-compose.yml. Leaving production mode must not become a route to letting the app
# issue DDL against the live database.
services:
  api:
    environment:
      NODE_ENV: development
      # The frontend calls the API cross-origin (:3000 -> :4000), so a browser on another
      # device only gets through if its origin is allow-listed. Without the LAN entry the
      # /me call is blocked by CORS, AuthProvider reads that failure as "not signed in",
      # and you are bounced to /login even with a valid session. The Wi-Fi IP is
      # DHCP-assigned: if the host's address changes, update it here and recreate the api
      # container. (Set here rather than inherited from code/.env because that file's copy
      # has already gone stale once — it still says .111.)
      CORS_ORIGIN: "http://localhost:3000,http://192.168.8.103:3000"
