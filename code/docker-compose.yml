services:
  # The local Postgres service was removed on 2026-07-17. The stack now talks straight to
  # the live promptxdb_prod (DATABASE_URL in the git-ignored code/.env), so there is no
  # local database to fall back on and no `docker compose down -v` reset: that data is real
  # and api/docs/schema-redesign.sql drops it. `git revert` this commit to get local dev back.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: production
      DB_ENGINE: postgres
      # From the git-ignored code/.env — never hardcode the prod credential in this tracked
      # file. `:?` makes a missing value abort the stack rather than silently fall back.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in code/.env}
      # The app must never issue DDL (api/Dockerfile explains why). The image already sets
      # this, so it is stated again here on purpose: an image built before that ENV existed
      # boots happily and silently migrates whatever DATABASE_URL points at — which is how
      # a stale image once dumped a full obsolete schema into this database's `public`.
      # The image is not a trustworthy place to keep the only copy of a safety switch.
      DB_SKIP_MIGRATE: "1"
      # The app's tables live in `lakeshore` and the app never creates them (see docs/DB.md).
      # Nothing in this stack creates them either — the postgres service that used to build the
      # schema on a fresh volume is gone, so whatever DATABASE_URL points at owns its own schema
      # and someone applies api/docs/schema-redesign.sql (fresh) or a script from
      # api/docs/migrations/ (live) to it by hand. Booting against a database nobody did that
      # for gets you a running API that finds no tables.
      DB_SCHEMA: ${DB_SCHEMA:-lakeshore}
      PORT: "4000"
      UPLOAD_DIR: /data/uploads
      # REQUIRED in production (no allow-all). Comma-separated origins.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Hand the matching to the external workflow (api/docs/EXTERNAL-MATCHER.md). The database
      # needs the columns the workflow writes to first — current as of
      # api/docs/migrations/2026-07-17-single-clean-name-and-result-status.sql, which is a
      # breaking change for the workflow's own INSERT and has to be coordinated with it.
      EXTERNAL_MATCHER: ${EXTERNAL_MATCHER:-}
      COMPANY_WEBHOOK_URL: ${COMPANY_WEBHOOK_URL:-}
      FACEBOOK_WEBHOOK_URL: ${FACEBOOK_WEBHOOK_URL:-}
      WEBHOOK_CALLBACK_URL_BASE: ${WEBHOOK_CALLBACK_URL_BASE:-}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN:-}
      # Center sign-in. Without these the container has no Center to talk to and every
      # attempt fails with "Center sign-in is temporarily unavailable" — which is exactly
      # what happened before they were added: the values were in code/.env, but nothing
      # forwarded them into the container. Production REQUIRES this (or SMTP_HOST) to boot.
      CENTER_PLAYME_URL: ${CENTER_PLAYME_URL:-}
      # Optional. center.ts omits the field when this is empty, because Center rejects a
      # login carrying an unexpected group id — so blank is meaningfully different from zero.
      CENTER_GROUP_IAM2_ID: ${CENTER_GROUP_IAM2_ID:-}
    ports:
      - "4000:4000"
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Empty => frontend derives the API host from window.location at runtime,
        # so LAN visitors reaching the site by IP also reach the API by that IP.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-}
        # Empty => the login form drives Center, which is the production path and needs
        # CENTER_PLAYME_URL on the api service. `local` switches it to Network Intel's own
        # password + emailed-code sign-in. The LAN profile sets it in the override file.
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
