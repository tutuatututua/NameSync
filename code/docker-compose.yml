services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: namesync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-namesync}
      POSTGRES_DB: namesync
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namesync -d namesync"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: production
      DB_ENGINE: postgres
      DATABASE_URL: postgres://namesync:${POSTGRES_PASSWORD:-namesync}@postgres:5432/namesync
      PORT: "8080"
      UPLOAD_DIR: /data/uploads
      # REQUIRED in production (no allow-all). Comma-separated origins.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COMPANY_WEBHOOK_URL: ${COMPANY_WEBHOOK_URL:-}
      FACEBOOK_WEBHOOK_URL: ${FACEBOOK_WEBHOOK_URL:-}
      COMPARE_WEBHOOK_URL: ${COMPARE_WEBHOOK_URL:-}
      WEBHOOK_CALLBACK_URL_BASE: ${WEBHOOK_CALLBACK_URL_BASE:-}
      CALLBACK_TOKEN: ${CALLBACK_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      - api-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Empty => frontend derives the API host from window.location at runtime,
        # so LAN visitors reaching the site by IP also reach the API by that IP.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
  pgdata:
